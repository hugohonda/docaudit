name: ci

# Os minutos do Actions são contados num repositório privado. Este workflow é
# o barato, em todo PR: um job só, um runner, uma instalação, na versão do
# `.python-version`. O caro, com as outras versões do Python, o macOS e o
# Tesseract de verdade, é o `ci-completo`, que roda quando pedido.
#
# O push na main não roda nada: a regra da main exige o PR atualizado com ela
# antes de juntar, então este check já viu o mesmo código.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O nome do job é o check obrigatório da main.
  ci-ok:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # hatch-vcs precisa das tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked --all-groups --extra tesseract --extra ppocr --extra vlm --extra layout --extra openvino
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml') }}
      # Segredos em todo o histórico do PR. O binário vem com o hash conferido.
      - name: varredura de segredos
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact .
          rm gitleaks gitleaks.tgz
      # O mesmo que `just ci` no laptop; a receita no justfile diz o que entra.
      - run: uv run just ci
