name: docs

# A documentação sai das docstrings, então ela se atualiza sozinha a cada push
# que mexe no código. O build roda em todo PR (workflow `ci`); aqui só publica.
# Publicar no Pages a partir de um repositório privado exige plano pago. Até o
# repositório ser público, ou o Pages ser habilitado, este workflow roda só por
# acionamento manual; o build em si é verificado em todo PR pelo workflow `ci`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # mkdocs-material usa a data do git nas páginas
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked --only-group docs
      - run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
