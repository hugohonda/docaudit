version: 2
updates:
  # Nada entra com menos de 7 dias. Sem `cooldown`, o padrão do Dependabot é 3.
  # O `exclude-newer` do pyproject.toml aplica a mesma janela ao `uv lock`.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # Um PR por mês com todas as actions. Separadas, cinco bumps viram
      # cinco PRs que se invalidam a cada merge.
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dev:
        patterns: ["ruff", "pyright", "ty", "zizmor", "pytest*", "mkdocs*", "prek"]

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns: ["*"]
